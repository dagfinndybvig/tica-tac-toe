<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Model - Tic-Tac-Toe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
            margin-top: 20px;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .nav a {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s;
        }
        
        .nav a:hover {
            background: #764ba2;
        }
        
        .training-controls {
            text-align: center;
            margin-bottom: 30px;
        }
        
        button {
            padding: 15px 40px;
            font-size: 18px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        button:hover:not(:disabled) {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .progress-container {
            margin: 30px 0;
        }
        
        .progress-bar {
            width: 100%;
            height: 30px;
            background: #eee;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        
        .progress-text {
            text-align: center;
            color: #555;
            font-size: 18px;
            margin-bottom: 20px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        
        .stat-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            color: #666;
            margin-top: 5px;
        }
        
        .message {
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
            font-weight: 600;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .message.info {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Train Model</h1>
        
        <div class="nav">
            <a href="/">Home</a>
            <a href="/play">Play Game</a>
        </div>
        
        <div class="training-controls">
            <button id="startTraining" onclick="startTraining()">Start Training (100 games)</button>
        </div>
        
        <div id="message" class="message hidden"></div>
        
        <div class="progress-container" id="progressContainer" style="display: none;">
            <div class="progress-text" id="progressText">Preparing to train...</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill">0%</div>
            </div>
            
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-value" id="winsCount">0</div>
                    <div class="stat-label">Player 1 Wins</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="drawsCount">0</div>
                    <div class="stat-label">Draws</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="lossesCount">0</div>
                    <div class="stat-label">Player 2 Wins</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let trainingInterval = null;
        
        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
            messageEl.classList.remove('hidden');
        }
        
        function hideMessage() {
            document.getElementById('message').classList.add('hidden');
        }
        
        async function startTraining() {
            const button = document.getElementById('startTraining');
            button.disabled = true;
            button.textContent = 'Training...';
            
            hideMessage();
            document.getElementById('progressContainer').style.display = 'block';
            
            try {
                // Start training
                const response = await fetch('/api/start_training', {
                    method: 'POST'
                });
                
                if (!response.ok) {
                    throw new Error('Failed to start training');
                }
                
                // Poll for training status
                trainingInterval = setInterval(checkTrainingStatus, 500);
                
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
                button.disabled = false;
                button.textContent = 'Start Training (100 games)';
            }
        }
        
        async function checkTrainingStatus() {
            try {
                const response = await fetch('/api/training_status');
                const status = await response.json();
                
                const progress = status.progress;
                const total = status.total_games;
                const percentage = (progress / total) * 100;
                
                // Update progress bar
                const progressFill = document.getElementById('progressFill');
                progressFill.style.width = percentage + '%';
                progressFill.textContent = Math.round(percentage) + '%';
                
                // Update progress text
                document.getElementById('progressText').textContent = 
                    `Training: ${progress} / ${total} games completed`;
                
                // Update stats
                document.getElementById('winsCount').textContent = status.results.wins;
                document.getElementById('drawsCount').textContent = status.results.draws;
                document.getElementById('lossesCount').textContent = status.results.losses;
                
                // Check if training is complete
                if (!status.is_training && progress > 0) {
                    clearInterval(trainingInterval);
                    showMessage('Training complete! Model saved successfully.', 'success');
                    
                    const button = document.getElementById('startTraining');
                    button.disabled = false;
                    button.textContent = 'Start Training (100 games)';
                }
                
            } catch (error) {
                clearInterval(trainingInterval);
                showMessage('Error checking training status: ' + error.message, 'error');
            }
        }
    </script>
</body>
</html>
